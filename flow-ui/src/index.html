<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FLOW</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-left">
        <div class="logo">FLOW</div>
        <span class="badge" id="status-badge">starting...</span>
      </div>
      <div class="header-right">
        <span class="local-ip" id="local-ip"></span>
      </div>
    </header>

    <div class="body">
      <!-- Top Row -->
      <div class="top-row">
        <section class="card card-info">
          <h3 class="card-title">This Machine</h3>
          <div class="info-grid">
            <span class="label">Name</span>
            <span class="value" id="my-name">—</span>
            <span class="label">OS</span>
            <span class="value" id="my-os">—</span>
            <span class="label">IP</span>
            <span class="value ip-value" id="my-ip">—</span>
            <span class="label">Monitors</span>
            <span class="value" id="my-monitors">—</span>
          </div>
        </section>

        <section class="card card-connect">
          <h3 class="card-title">Connect to Peer</h3>
          <div class="connect-form">
            <input type="text" id="peer-ip" placeholder="Peer's IP address" />
            <button id="connect-btn" onclick="connectPeer()">Connect</button>
          </div>
          <p class="hint">Enter the IP shown on the other machine</p>
        </section>

        <section class="card card-peers">
          <h3 class="card-title">
            Peers
            <span class="peer-count" id="peer-count">0</span>
          </h3>
          <div id="peers-list" class="peers-list">
            <div class="empty-state">Waiting for peers...</div>
          </div>
        </section>
      </div>

      <!-- Monitor Layout -->
      <section class="card card-monitors">
        <h3 class="card-title">Monitor Layout</h3>
        <div class="monitor-canvas" id="monitor-canvas">
          <div class="empty-state">Detecting monitors...</div>
        </div>
      </section>

      <!-- Bottom Row: Send File + Clipboard -->
      <div class="bottom-row">
        <section class="card card-file">
          <h3 class="card-title">Send File</h3>
          <button class="send-file-btn" id="send-file-btn" onclick="pickAndSend()">
            <span class="send-icon">+</span>
            Choose file to send
          </button>
          <div id="file-status" class="file-status"></div>
        </section>

        <section class="card card-clipboard">
          <h3 class="card-title">
            Clipboard
            <span class="sync-dot"></span>
          </h3>
          <div id="clipboard-log" class="clipboard-log">
            <div class="empty-state">Copy something to see it here</div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
