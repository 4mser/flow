<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FLOW</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">FLOW</div>
        <span class="badge" id="status-badge">starting...</span>
      </div>
      <div class="header-right">
        <span class="peer-id" id="my-peer-id"></span>
      </div>
    </header>

    <!-- Body -->
    <div class="body">
      <!-- Top Row: Info + Connect + Peers -->
      <div class="top-row">
        <section class="card card-info">
          <h3 class="card-title">This Machine</h3>
          <div class="info-grid">
            <span class="label">Name</span>
            <span class="value" id="my-name">—</span>
            <span class="label">OS</span>
            <span class="value" id="my-os">—</span>
            <span class="label">Monitors</span>
            <span class="value" id="my-monitors">—</span>
          </div>
        </section>

        <section class="card card-connect">
          <h3 class="card-title">Connect to Peer</h3>
          <div class="connect-form">
            <input type="text" id="peer-ip" placeholder="192.168.1.50" />
            <button id="connect-btn" onclick="connectPeer()">Connect</button>
          </div>
          <p class="hint">Enter IP or wait for auto-discovery</p>
        </section>

        <section class="card card-peers">
          <h3 class="card-title">
            Peers
            <span class="peer-count" id="peer-count">0</span>
          </h3>
          <div id="peers-list" class="peers-list">
            <div class="empty-state">Waiting for peers...</div>
          </div>
        </section>
      </div>

      <!-- Monitor Layout -->
      <section class="card card-monitors">
        <h3 class="card-title">Monitor Layout</h3>
        <div class="monitor-canvas" id="monitor-canvas">
          <div class="empty-state">Detecting monitors...</div>
        </div>
      </section>

      <!-- Clipboard -->
      <section class="card card-clipboard">
        <h3 class="card-title">
          Clipboard
          <span class="sync-dot"></span>
        </h3>
        <div id="clipboard-log" class="clipboard-log">
          <div class="empty-state">Copy something to see it here</div>
        </div>
      </section>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
